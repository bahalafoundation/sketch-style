<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <!-- Isometric projection: u = (0.866,-0.5), v = (-0.866,-0.5), w = (0,-1),
       origin (front bottom corner) at (205, 265).
       Footprint 150 (u) x 110 (v), wall height 85, roof rise 55. -->
  <g fill="none" stroke="#5c4954" stroke-width="5.5"
     stroke-linecap="round" stroke-linejoin="round">
    <!-- sun -->
    <circle cx="60" cy="55" r="20" fill="#f0e3a8"/>
    <!-- ground plot -->
    <polygon points="200.7,287.5 373.9,187.5 244,112.5 70.8,212.5" fill="#dfe8d8"/>
    <!-- left wall -->
    <polygon points="205,265 109.7,210 109.7,125 205,180" fill="#f4efe6"/>
    <!-- right wall + gable -->
    <polygon points="205,265 334.9,190 334.9,105 269.9,87.5 205,180" fill="#e7dfd0"/>
    <!-- left roof slope -->
    <polygon points="205,180 109.7,125 174.7,32.5 269.9,87.5" fill="#c58bd0"/>
    <!-- right roof slope -->
    <polygon points="334.9,105 239.6,50 174.7,32.5 269.9,87.5" fill="#b273c1"/>
    <!-- chimney -->
    <polygon points="282.9,95 267.4,86 267.4,41 282.9,50" fill="#bdb8b2"/>
    <polygon points="282.9,95 298.5,86 298.5,41 282.9,50" fill="#a9a39d"/>
    <polygon points="282.9,50 298.5,41 282.9,32 267.4,41" fill="#8f8983"/>
    <!-- door (right wall) -->
    <polygon points="226.7,252.5 257,235 257,180 226.7,197.5" fill="#a3bda6"/>
    <circle cx="252.6" cy="209.5" r="3.5" fill="#5c4954" stroke="none"/>
    <!-- window, right wall -->
    <polygon points="282.9,185 313.3,167.5 313.3,137.5 282.9,155" fill="#9db1dd"/>
    <line x1="298.1" y1="176.3" x2="298.1" y2="146.3"/>
    <line x1="282.9" y1="170" x2="313.3" y2="152.5"/>
    <!-- window, left wall -->
    <polygon points="179,215 148.7,197.5 148.7,167.5 179,185" fill="#9db1dd"/>
    <line x1="163.9" y1="206.3" x2="163.9" y2="176.3"/>
    <line x1="179" y1="200" x2="148.7" y2="182.5"/>
  </g>
</svg>
